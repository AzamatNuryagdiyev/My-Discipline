<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0B0D10" id="meta-theme-color" />
  <meta name="description" content="MY DISCIPLINE — Shaxsiy intizom, kunlik vazifalar, streak va maqsadlar tizimi" />

  <!-- PWA & Apple Web App Meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Discipline" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/jpeg" href="./assets/icons/icon.jpg" />
  <link rel="apple-touch-icon" href="./assets/icons/icon.jpg" />

  <title>MY DISCIPLINE — Shaxsiy Intizom Tizimi</title>

  <!-- Local CSS Only — Zero External CDN Dependencies -->
  <link rel="stylesheet" href="./css/main.css?v=2.0.1" />
  <link rel="stylesheet" href="./css/components.css?v=2.0.1" />
  <link rel="stylesheet" href="./css/responsive.css?v=2.0.1" />
</head>
<body>

  <!-- Online/Offline & Update Notification Banner -->
  <div id="status-banner-root"></div>

  <div class="app-container">

    <!-- DESKTOP LEFT SIDEBAR -->
    <aside class="desktop-sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">MY DISCIPLINE</span>
      </div>

      <nav id="desktop-nav" class="sidebar-nav" aria-label="Desktop Navigatsiya">
        <!-- Rendered by JS -->
      </nav>

      <div class="sidebar-footer">
        <button id="btn-sidebar-user" class="sidebar-user-btn" title="Ismni o‘zgartirish yoki sozlamalar">
          <div class="sidebar-avatar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span id="sidebar-user-name">Azamat</span>
          <span style="margin-left: auto; font-size: 11px; opacity: 0.5;" title="Tahrirlash">✎</span>
        </button>
      </div>
    </aside>

    <!-- MAIN WORKSPACE -->
    <div class="main-wrapper">

      <!-- TOP STICKY HEADER -->
      <header class="app-header">
        <div class="header-inner">
          <div class="brand-wrapper">
            <h1 class="brand-title">MY DISCIPLINE</h1>
          </div>

          <div class="header-actions">
            <!-- Streak Pill -->
            <button id="btn-header-streak" class="stat-pill streak" title="Joriy seriya" aria-label="Joriy seriya">
              <span>🔥</span>
              <span id="hdr-streak">0 kun</span>
            </button>

            <!-- Points Pill -->
            <button id="btn-header-points" class="stat-pill points" title="Jami ball" aria-label="Jami ball">
              <span>⚡</span>
              <span id="hdr-points">0 ball</span>
            </button>

            <!-- Settings Gear Button -->
            <button id="btn-header-settings" class="icon-btn" title="Sozlamalar" aria-label="Sozlamalar">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- MAIN DYNAMIC CONTENT -->
      <main id="app-main" class="content-area">
        <!-- Rendered by JS -->
      </main>

    </div>

    <!-- MOBILE 5-ITEM BOTTOM NAVIGATION -->
    <nav class="mobile-nav" aria-label="Mobil Navigatsiya">
      <div id="mobile-nav" class="mobile-nav-inner">
        <!-- Rendered by JS -->
      </div>
    </nav>

  </div>

  <!-- MODAL ROOT CONTAINER -->
  <div id="modal-root" class="modal-backdrop"></div>

  <!-- TOAST FEEDBACK CONTAINER -->
  <div id="toast-root"></div>

  <!-- APPLICATION ENTRYPOINT (ES MODULES) -->
  <script type="module" src="./js/app.js?v=2.0.1"></script>

</body>
</html>
