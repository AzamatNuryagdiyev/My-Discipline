<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="#222732" stroke-width="8"/>

  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1B1F27" stroke-width="4"/>

  <!-- Emerald Shield / Badge -->
  <g filter="url(#glow)">
    <circle cx="256" cy="256" r="120" fill="rgba(16, 185, 129, 0.12)" stroke="url(#emeraldGrad)" stroke-width="6"/>
    <!-- Checkmark -->
    <path d="M190 262 L236 308 L328 206" fill="none" stroke="url(#emeraldGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lightning Bolt Badge -->
  <g transform="translate(340, 120) scale(0.9)">
    <circle cx="20" cy="20" r="28" fill="#F59E0B" />
    <path d="M22 6 L10 24 L19 24 L17 34 L29 16 L20 16 Z" fill="#0B0D10" stroke="#0B0D10" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
